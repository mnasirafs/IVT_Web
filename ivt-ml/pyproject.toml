[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ivt-ml"
version = "0.1.0"
description = "Explainable hybrid anomaly detection (autoencoder + logistic regression) for IVT invoice validation"
requires-python = ">=3.10,<3.13"
dependencies = [
  "pandas==2.2.0",
  "numpy==1.26.4",
  "scikit-learn==1.5.2",
  "pyodbc==5.2.0",
  "joblib==1.5.3",
  "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
ivt-ml = "ivt_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
